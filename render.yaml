services:
  # 1. FastAPI Web Server
  - type: web
    name: acr-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: acr-postgres
          property: connectionString
      - key: SYNC_DATABASE_URL
        fromDatabase:
          name: acr-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: cache
          name: acr-redis
          property: connectionString
      - key: ENCRYPTION_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false

  # 2. Celery Asynchronous Worker (optional — requires Redis cache service)
  - type: worker
    name: acr-worker
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A app.tasks.tasks.celery_app worker --loglevel=info
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: acr-postgres
          property: connectionString
      - key: SYNC_DATABASE_URL
        fromDatabase:
          name: acr-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: cache
          name: acr-redis
          property: connectionString
      - key: ENCRYPTION_KEY
        sync: false
      - key: JWT_SECRET
        fromService:
          type: web
          name: acr-backend
          property: envVar:JWT_SECRET
      - key: GROQ_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false

# 3. Redis Cache/Broker (optional — required only for Celery worker + WebSocket progress)
cache:
  name: acr-redis
  plan: free

# 4. PostgreSQL Managed Database (required)
databases:
  - name: acr-postgres
    plan: free
